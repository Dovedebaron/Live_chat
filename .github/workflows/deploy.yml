name: Deploy Directly to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key & Clean IP
        env:
          # Your new Base64 secret
          SSH_PRIVATE_KEY_BASE64: ${{ secrets.SSH_PRIVATE_KEY }}
          ORACLE_IP: ${{ secrets.ORACLE_IP }}
        run: |
          # Strip formatting errors from IP
          CLEAN_IP=$(echo -n "$ORACLE_IP" | tr -d '\r\n ')
          echo "SERVER_IP=$CLEAN_IP" >> $GITHUB_ENV

          # Configure strict local runner directory permissions
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # FIX: Decode the Base64 key cleanly to recreate the exact file structure
          echo "$SSH_PRIVATE_KEY_BASE64" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Scan the remote host keys
          ssh-keyscan -H "$CLEAN_IP" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync project files to Oracle Server
        run: |
          # 1. Prepare target directory using verbose SSH logging (-vvv) to expose any handshake failures
          ssh -vvv -i ~/.ssh/id_ed25519 ubuntu@$SERVER_IP "sudo mkdir -p /opt/live_chat && sudo chown -R ubuntu:ubuntu /opt/live_chat"

          # 2. Sync files natively without local sudo
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            ./ ubuntu@$SERVER_IP:/opt/live_chat/

      - name: Build and Restart on Oracle Server
        run: |
          ssh -i ~/.ssh/id_ed25519 ubuntu@$SERVER_IP "bash -s" << 'EOF'
          cd /opt/live_chat

          echo "Building containers natively on ARM64..."
          sudo docker compose build

          echo "Restarting containers..."
          sudo docker compose down || true
          docker compose up -d

          echo "Cleaning up dangling images..."
          sudo docker image prune -f
          EOF

      - name: Verify deployment
        run: |
          sleep 5
          echo "Checking if app is healthy..."
          curl -f --connect-timeout 5 --max-time 15 http://51.170.133.252 || exit 1
          echo "Verification passed! App is responsive on HTTP"
